module_name: MSP OSD
serial_config:
    - command: msp_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: MSP_OSD_CONFIG
        group: OSD

parameters:
    - group: OSD
      definitions:

        # OSD Parameters
        OSD_SYMBOLS:
            description:
                short: OSD Symbol Selection
                long: |
                  Configure / toggle support display options.
            type: bitmask
            bit:
                0: CRAFT_NAME (hardcoded)
                1: DISARMED
                2: GPS_LAT
                3: GPS_LON
                4: GPS_SATS
                5: GPS_SPEED
                6: HOME_DIST
                7: HOME_DIR
                8: MAIN_BATT_VOLTAGE
                9: CURRENT_DRAW
                10: MAH_DRAWN
                11: RSSI_VALUE
                12: ALTITUDE
                13: NUMERICAL_VARIO
                14: FLYMODE
                15: ESC_TMP
                16: PITCH_ANGLE
                17: ROLL_ANGLE
                18: CROSSHAIRS
                19: HORIZON_SIDEBARS
                20: POWER
                21: AIRSPEED
                22: STALL_WARNING
                23: HEADING
                24: WARNING
                25: ARTIFICIAL_HORIZON
                26: ALT_MAX_WARNING
                27: G_METER
                28: ESC_RPM
                29: ESC_AMP
                30: PULL_POT
                31: THROTTLE
            default: 266623474

        # OSD Crosshairs Vertical Offset
        OSD_CH_HEIGHT:
            description:
                short: OSD Crosshairs Vertical Offset
                long: |
                  Controls the vertical offset of the crosshair from center position (26, 10).
                  Positive values move the crosshair down, negative values move it up.
                  Range: -10 (top of screen) to +9 (bottom of screen).
            type: int32
            default: 0
            min: -10
            max: 9

        # OSD Artificial Horizon Width
        OSD_AH_WIDTH:
            description:
                short: Artificial Horizon Width
                long: |
                  Width of the artificial horizon bar in characters (centered on crosshair).
                  Range: 3 to 45 characters. Default: 25.
            type: int32
            default: 25
            min: 3
            max: 45

        # OSD Artificial Horizon Pitch Offset
        OSD_AH_OFFSET:
            description:
                short: Artificial Horizon Pitch Offset
                long: |
                  Pitch offset in degrees to compensate for PX4 mounting misalignment.
                  Positive values shift the horizon up (nose down correction).
                  Range: -10 to +10 degrees. Default: 0.
            type: float
            default: 0.0
            min: -10.0
            max: 10.0
            decimal: 1

        # OSD Artificial Horizon Mode
        OSD_AH_MODE:
            description:
                short: Artificial Horizon Mode
                long: |
                  Display mode for the artificial horizon:
                  0 = Moving horizon (classic, pitch ladder not available)
                  1 = Fixed horizon (pitch ladder available via OSD_LADDER_SIDE)
            type: enum
            values:
                0: Moving
                1: Fixed
            default: 1

        # OSD Pitch Ladder Side
        OSD_LADDER_SIDE:
            description:
                short: Pitch Ladder Graduations Side
                long: |
                  Which side(s) to display pitch ladder graduations.
                  This parameter only applies when OSD_AH_MODE = 1 (Fixed horizon).
                  When OSD_AH_MODE = 0 (Moving), this parameter is ignored.
                  1 = Left side only
                  2 = Right side only
                  3 = Both sides
            type: enum
            values:
                1: Left
                2: Right
                3: Both
            default: 1

        OSD_LADDER_STEP:
            description:
                short: Pitch Ladder Graduation Step
                long: |
                  Angular spacing between pitch ladder graduations.
                  This parameter only applies when OSD_AH_MODE = 1 (Fixed horizon).
                  5° = Dense ladder, 30° = Sparse ladder
            type: enum
            values:
                5: 5°
                10: 10°
                15: 15°
                20: 20°
                30: 30°
            default: 20

        # OSD Log Level
        OSD_LOG_LEVEL:
            description:
                short: OSD Warning Level
                long: |
                  Minimum security of log level to display on the OSD.
            type: int32
            bit:
                0: EMERGENCY
                1: ALERT
                2: CRITICAL
                3: ERROR
                4: WARNING
                5: NOTICE
                6: INFO
                7: DEBUG
                8: NONE
            default: 3

        # Scroll Speed
        OSD_SCROLL_RATE:
            description:
                short: OSD Scroll Rate (ms)
                long: |
                    Scroll rate in milliseconds for OSD messages longer than available character width.
                    This is lower-bounded by the nominal loop rate of this module.
            type: int32
            min: 100
            max: 1000
            default: 125

        # Dwell TIme
        OSD_DWELL_TIME:
            description:
                short: OSD Dwell Time (ms)
                long: |
                    Amount of time in milliseconds to dwell at the beginning of the display, when scrolling.
            type: int32
            min: 100
            max: 10000
            default: 500

        # RC Stick input
        OSD_RC_STICK:
            description:
                short: OSD RC Stick commands
                long: |
                    Forward RC stick input to VTX when disarmed
            type: enum
            values:
                0: Disabled
                1: Enabled
            default: 1

        # Speed Unit (applies to GPS Speed and Airspeed)
        OSD_SPEED_UNIT:
            description:
                short: Speed Display Unit
                long: |
                    Speed display unit for GPS Speed and Airspeed
            type: enum
            values:
                0: m/s
                1: km/h
            default: 1

        # GPS Speed Type
        OSD_GPS_SPDTYPE:
            description:
                short: GPS Speed Calculation Type
                long: |
                    GPS speed calculation type
            type: enum
            values:
                0: 2D Horizontal (Ground Speed)
                1: 3D Total (Including Vertical)
            default: 1

        # Airspeed Source
        OSD_ASPD_SRC:
            description:
                short: Airspeed Source
                long: |
                    Airspeed data source
            type: enum
            values:
                0: IAS (Indicated)
                1: CAS (Calibrated)
                2: TAS (True)
                3: CAS Ground-Wind
                4: TAS Ground-Wind
            default: 2

        # Stall Warning Test Mode
        OSD_STALL_TEST:
            description:
                short: Stall Warning Test
                long: |
                    Force stall warning flash for testing
            type: enum
            values:
                0: Disabled
                1: Test Mode
            default: 0

        OSD_MAX_ALT:
            description:
                short: Maximum Altitude Warning (m)
                long: |
                    Maximum altitude above takeoff point in meters. When exceeded, displays orange warning. Set to 0 to disable.
            type: int32
            min: 0
            max: 500
            default: 0

        OSD_MAX_ALT_TEST:
            description:
                short: Max Altitude Warning Test
                long: |
                    Force max altitude warning display for testing
            type: enum
            values:
                0: Disabled
                1: Test Mode
            default: 0

        OSD_MAX_G:
            description:
                short: Maximum G-Force Limit
                long: |
                    Maximum G-force limit. Display changes color: white (normal), orange (>80% limit), red (>limit). Set to 0 to disable color coding.
            type: float
            min: 0.0
            max: 20.0
            default: 8.0
            decimal: 1

        OSD_PULLPOT_SRC:
            description:
                short: PullPot source
                long: |
                    Source used for PullPot limit computation.
                    Formula mode uses FW_AIRSPD_STALL.
                    CSV mode reads the file /fs/microsd/vn_limits.csv at startup, stores it in RAM,
                    then interpolates g_max from TAS.
                    File name on SD must be exactly: vn_limits.csv
                    Expected line format: TAS_m_s,g_max
                    Example lines:
                    39,0.833
                    84,3.8
            type: enum
            values:
                0: Stall Speed (Vs)
                1: CSV on SD
            default: 0

        OSD_PULLPOT_TEST:
            description:
                short: PullPot Test Mode
                long: |
                    Force PullPot test mode:
                    - fixed load factor at 3.0g
                    - TAS varies automatically over time
                    Useful to validate PullPot display behavior on the bench.
            type: enum
            values:
                0: Disabled
                1: Test Mode
            default: 0

        # ========================================
        # OSD Element Positions (53x20 grid - Walksnail/DJI HD)
        # Position encoding: pos = 2048 + X + (Y * 32)
        # Enable/Disable via OSD_SYMBOLS bitmask above
        # ========================================

        # Max Altitude Warning Position
        OSD_MAX_ALT_X:
            description:
                short: Max Altitude Warning X position
            type: int32
            min: 0
            max: 52
            default: 17

        OSD_MAX_ALT_Y:
            description:
                short: Max Altitude Warning Y position
            type: int32
            min: 0
            max: 19
            default: 8

